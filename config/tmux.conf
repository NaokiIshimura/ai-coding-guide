# prefixをC-a にする(CtrlキーはCapsと入れ替えておくと小指が楽です)
# C-a の CはCtrlキーを押しながら、の意
set -g prefix C-a

# 通常は C-b がprefixなのでunbind
unbind C-b

# tmuxの表示履歴(history)のlimitを10000に
set-option -g history-limit 10000

# マウスの設定を追加
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# C-a K で履歴をクリア
bind K clear-history

# C-aを2回押すとアプリケーションにわたす
bind C-a send-prefix

# ウィンドウのインデックスを1から始める
set -g base-index 1

# 枠(ペイン)のインデックスを1から始める
setw -g pane-base-index 1

# 設定の再読み込みを C-a r で行えるようにする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# C-a | で横に枠を分けられるように
bind \\ split-window -h

# C-a - で縦に枠を分けられるように
bind - split-window -v

# vimのように枠を移動できるように
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

## tmux内でbeep(警告音)を発するような状態になったら点滅するように
setw -g monitor-activity on
set -g visual-activity on

# ペイン境界線を見やすくする
# 境界線を太線にする（single/double/heavy/simple/numberから選択）
set -g pane-border-lines heavy
# 非アクティブペインの境界線をグレーに
set -g pane-border-style 'fg=colour240'
# アクティブペインの境界線をcyanで強調
set -g pane-active-border-style 'fg=cyan'

# ペインの上部にタイトルバーを表示（ペイン番号・カレントディレクトリ）
set -g pane-border-status top
set -g pane-border-format ' #P: #{pane_current_path} '

# ステータスバーの設定
# ステータスバーを上に
set -g status-position top

# コピーモード時のキーバインディングをvimに
setw -g mode-keys vi

# Use 256 color
set -g default-terminal "screen-256color"

# Prefix key が押されているかどうかを表示する
#set-option -g status-left '#[fg=cyan,bg=#303030]#{?client_prefix,#[reverse],} tmux #[default]'
#set-option -g status-left '#[fg=cyan,bg=#303030]#{?client_prefix,#[reverse],} #H[#S] #[default]'
#set-option -g status-left '#{?client_prefix,#[reverse],} [#I] #W  #[default]'
# #W：ウィンドウ名
# #I：ウィンドウ番号
# #S：セッション番号
#set-option -g status-left '#{?client_prefix,#[fg=white]#[bg=red],} [#W] #[default]'
#set-option -g status-left '#{?client_prefix,#[fg=white]#[bg=red],} [#I] #W  #[default]'

# status leftの最大文字数を変更
set-option -g status-left-length 30
# [セッション番号][ウィンドウ番号][ウィンドウ名]
set-option -g status-left '#{?client_prefix,#[fg=white]#[bg=red],} [#S][#I][#W] #[default] '
#set-option -g status-left '#{?client_prefix,#[fg=white]#[bg=red],} #[default]'

# 選択中/非選択のウィンドウを目立たせる
set-window-option -g window-status-current-style 'fg=black,bg=red'
set-window-option -g window-status-style 'fg=black,bg=yellow'
set-window-option -g window-status-current-format ' #I:#W#F '
set-window-option -g window-status-format ' #I:#W#F '
set-window-option -g window-status-separator ''

# status-rightに秒まで表示するため、ステータスバーの更新間隔を1秒に
set-option -g status-interval 1

# status-rightの表示可能な幅を拡張（デフォルト項目＋ボタン群を表示するため）
# ペインタイトルは #{=21:...} で21幅に収まるため通常は最大71幅だが、
# window_bigger時の座標表示やボタン追加に備えて余裕をもたせる
set-option -g status-right-length 120

# status-rightの先頭にtmuxデフォルトの項目（ペインタイトル・時刻・日付）を表示しつつ
# ウィンドウ一覧・ウィンドウ追加・ペイン分割のボタンを配置
set-option -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %-m月%-d日%-H時%-M分%-S秒 #[range=user|winlist,fg=black,bg=magenta] =Wins #[norange,default]#[range=user|newwin,fg=black,bg=green] +Win #[norange,default]#[range=user|splith,fg=black,bg=yellow] |Split #[norange,default]#[range=user|splitv,fg=black,bg=cyan] -Split #[norange,default]'

# status-right上のクリックを判定して、対応するコマンドを実行する
# range=user|X は StatusRight ではなく Status キーをトリガーする
# 独自ボタン以外（ウィンドウ名クリックなど）はデフォルトの switch-client -t= にフォールバックする
bind-key -n MouseDown1Status if -Ft= "#{m/r:^(newwin|splith|splitv|winlist)$,#{mouse_status_range}}" \
  'run-shell -b "case #{mouse_status_range} in newwin) tmux new-window ;; splith) tmux split-window -h ;; splitv) tmux split-window -v ;; winlist) tmux choose-tree -Zw ;; esac"' \
  "switch-client -t ="

